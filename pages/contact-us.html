<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/contact-us.css">
</head>
<body>
    <section class="contact-section">
        <div class="bg-blur"></div>
        <div class="contact-us">
            <div class="contact-box">
               <div class="x"> <a href="../index.html">
                    <svg preserveAspectRatio="xMidYMid meet" data-bbox="5.5 5.5 49 49" xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 49 49" role="presentation" aria-hidden="true">
                        <g>
                            <path d="M54.5 47.9L36.5 30l18-17.9-6.6-6.6-17.9 18-17.9-18-6.6 6.6 18 17.9-18 17.9 6.6 6.6 17.9-18 17.9 18 6.6-6.6z"></path>
                        </g>
                    </svg></a>
                </div>
                <span>Contact us</span>
                <p>For tour enquiries or any questions, 
                    please use the form below and we will get back to you.</p>
                <div class="contact-information">
                    <div class="first-last-name">
                        <div class="firstname">
                            <label for="firts-name">First Name *</label>
                            <input type="text" id="first-name" required>
                        </div>
                        <div class="lastname">
                            <label for="last-name">Last Name *</label>
                            <input type="text" id="last-name" required>
                        </div>
                    </div>
                    <div class="email">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="subject">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject">
                    </div>
                    <div class="message">
                        <label for="message">Leave us a message *</label>
                        <textarea col="100%" row="50" required></textarea>
                    </div>
                    <div class="button">
                        <button tupe="submit">Submit</button>
                    </div>
                    <div class="address">
                        <span>Address: 500 Terry Francine Street San Francisco, CA 94158</span>
                        <div class="contact-info">
                            <span>Mail: <a href="../index.html">info@mysite.com</a></span>
                            <span>Tel: 123-456-7890</span>
                        </div>
                    </div>
                </div> 
            </div>
        </div>
    </section>
</body>
</html>
